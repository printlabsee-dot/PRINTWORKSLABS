<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PrintWorksLabs — 3D lamps</title>
<style>
:root{--bg:#0b100e;--fg:#eef5f1;--mut:#98a69f;--card:#131a17;--acc:#2fd07f;--acc2:#7af0b0;--bd:#26332d;--sh:0 10px 30px rgba(0,0,0,.45);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b100e;--fg:#eef5f1;--mut:#98a69f;--card:#131a17;--bd:#26332d;--acc:#2fd07f;--sh:none}}
:root[data-theme="dark"]{--bg:#0b100e;--fg:#eef5f1;--mut:#98a69f;--card:#131a17;--bd:#26332d;--acc:#2fd07f;--sh:none}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;position:sticky;top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd);z-index:5}
.logo{font-weight:800;font-size:22px;cursor:pointer;letter-spacing:-.5px}.logo b{background:linear-gradient(90deg,var(--acc),#7af0b0);-webkit-background-clip:text;background-clip:text;color:transparent}
.hr{display:flex;gap:8px;align-items:center}
.lang button{border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:6px 11px;cursor:pointer}
.lang button:first-child{border-radius:9px 0 0 9px}.lang button:last-child{border-radius:0 9px 9px 0}
.lang button.on{background:var(--acc);color:#04170d;border-color:var(--acc)}
#cartb,#accb,#trkb{position:relative;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:10px;padding:6px 10px;cursor:pointer;font-size:16px}
#cnt{position:absolute;top:-7px;right:-7px;background:var(--acc2);color:#2b1d00;font:700 12px system-ui;min-width:20px;height:20px;border-radius:10px;display:none;align-items:center;justify-content:center}
main{max-width:940px;margin:0 auto;padding:18px}
h1{font-size:30px;margin:8px 0 4px}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:center;padding:36px 30px;border-radius:26px;color:#fff;background:linear-gradient(135deg,#06130d,#0f3a26 55%,#1f8f5a);margin-bottom:16px;overflow:hidden}
.hero h1{color:#fff;font-size:36px;line-height:1.15;margin:12px 0}.hero p{opacity:.85;margin:0 0 18px}
.pill{display:inline-block;background:#ffffff26;padding:4px 12px;border-radius:99px;font-size:13px}
.glow{height:210px;display:flex;align-items:flex-end;justify-content:center}.glow i{width:92px;height:145px;border-radius:46px 46px 12px 12px;background:linear-gradient(#fff3d1,#ffb347);box-shadow:0 0 80px 22px #ffb34788}
@media(max-width:640px){.hero{grid-template-columns:1fr;padding:24px 20px}.hero h1{font-size:27px}.glow{height:140px}}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:24px}
.feat div{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:12px;box-shadow:var(--sh);cursor:pointer;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-5px);box-shadow:0 16px 40px rgba(47,208,127,.25)}
.lamp{height:200px;display:flex;align-items:flex-end;justify-content:center;border-radius:16px;background:radial-gradient(circle at 50% 80%,hsl(var(--h) 35% 22%),hsl(var(--h) 30% 8%));margin-bottom:12px;overflow:hidden}
.lamp i{display:block;background:linear-gradient(#fff3d1,#ffb347);box-shadow:0 0 38px 6px #ffb34799}
.card h3{margin:0;font-size:17px}
.price{font-weight:800;color:var(--acc);margin-top:6px}
.btn{background:linear-gradient(135deg,#4ae39a,#1fa862);color:#04170d;border:0;border-radius:14px;padding:13px 20px;font:700 16px system-ui;cursor:pointer;box-shadow:0 6px 16px rgba(47,208,127,.3)}
.btn.g{background:var(--card);color:var(--fg);border:1px solid var(--bd);box-shadow:none}
.btn.amber{background:var(--acc2);color:#2b1d00;box-shadow:none}
.back{background:none;border:0;color:var(--acc);font:600 15px system-ui;cursor:pointer;padding:0 0 12px}
.pd{display:grid;gap:22px;grid-template-columns:1fr 1fr}
@media(max-width:640px){.pd{grid-template-columns:1fr}}
.pd .lamp{height:320px}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:34px;height:34px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font-size:18px;cursor:pointer}
.box{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:18px;box-shadow:var(--sh);margin-bottom:16px;display:grid;gap:12px}
.box h2{margin:0;font-size:19px}
.ci{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--bd);padding-bottom:10px}
label{display:grid;gap:4px;font-size:14px;color:var(--mut)}
input,select,textarea{font:inherit;padding:11px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);border-color:transparent}
.pay{display:flex;gap:8px;flex-wrap:wrap}.pay label{flex:1;min-width:150px;border:1px solid var(--bd);border-radius:14px;padding:12px;color:var(--fg);display:flex;gap:8px;align-items:center}
.pay input{width:auto}
.sum div{display:flex;justify-content:space-between;padding:2px 0}.sum .t{font-weight:800;font-size:20px;border-top:1px dashed var(--bd);margin-top:6px;padding-top:8px}
pre{white-space:pre-wrap;background:var(--bg);padding:12px;border-radius:12px;font-size:13px;overflow-x:auto}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}.btn.sm{padding:8px 16px;font-size:14px;border-radius:10px}
.galw{position:relative}.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:18px;scrollbar-width:none}.gal::-webkit-scrollbar{display:none}
.sl{flex:none;width:100%;height:320px;scroll-snap-align:start;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}.sl img{width:100%;height:100%;object-fit:cover}
.ga{position:absolute;top:160px;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:0;background:#000a;color:#fff;font-size:22px;cursor:pointer}.ga.l{left:8px}.ga.r{right:8px}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}.dots span{width:8px;height:8px;border-radius:50%;background:var(--bd)}.dots span.on{background:var(--acc)}
.sws{display:flex;gap:8px;flex-wrap:wrap}.sw{display:flex;align-items:center;gap:6px;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:12px;padding:8px 12px;cursor:pointer;font:inherit}.sw i{width:16px;height:16px;border-radius:50%;border:1px solid #888}.sw.on{border-color:var(--acc);outline:2px solid var(--acc)}
footer a{color:var(--acc)}
.sl{position:relative}.sl.ph{height:auto;aspect-ratio:4/5}.sl .tint{position:absolute;inset:0;mix-blend-mode:multiply;background:var(--tc);pointer-events:none}.galw .ga{top:calc(50% - 12px)}
footer{text-align:center;color:var(--mut);font-size:13px;padding:26px 18px}
.v{display:none}.v.on{display:block}
</style>
</head>
<body>
<header><div class="logo" onclick="go('home')">PrintWorks<b>Labs</b></div>
<div class="hr"><div class="lang"><button data-l="ru" class="on">RU</button><button data-l="en">EN</button><button data-l="et">ET</button></div>
<button id="gtb" title="Language" style="border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:10px;padding:6px 10px;cursor:pointer;font-size:16px">🌐</button><button id="trkb" onclick="go('track')">📦</button><button id="accb" onclick="go('acc')">👤</button><button id="cartb" onclick="go('cart')">🛒<span id="cnt"></span></button></div></header>
<div id="gt" style="display:none;position:fixed;top:64px;right:12px;z-index:9;background:var(--card);padding:10px;border:1px solid var(--bd);border-radius:12px"></div>
<main>
<div class="v on" id="v-home"><section class="hero"><div><span class="pill" data-t="pill"></span><h1 data-t="h1"></h1><p data-t="sub"></p><button class="btn amber" onclick="document.getElementById('grid').scrollIntoView({behavior:'smooth'})" data-t="shop"></button></div><div class="glow"><i></i></div></section>
<div class="feat"><div>🖨️<b data-t="f1"></b></div><div>🌍<b data-t="f2"></b></div><div>💳<b data-t="f3"></b></div></div><div class="grid" id="grid"></div>
<div class="box" style="margin-top:22px"><h2 data-t="cust"></h2><p style="margin:0;color:var(--mut)" data-t="custx"></p><div><button class="btn" onclick="go('custom')" data-t="custgo"></button></div></div>
<h2 style="margin:30px 0 12px" data-t="revs"></h2><div class="grid" id="revs"></div><div style="margin-top:14px"><button class="btn g" onclick="document.getElementById('rf').style.display='grid'" data-t="revw"></button></div>
<form id="rf" class="box" style="display:none;margin-top:14px"><label><span data-t="name"></span><input id="rn" required></label><label><span data-t="stars"></span><select id="rs"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></label><label><span data-t="revtxt"></span><textarea id="rt" rows="3" required></textarea></label><button class="btn" type="submit" data-t="revsend"></button><p id="rm" style="margin:0;color:var(--mut)"></p></form></div>

<div class="v" id="v-about"><button class="back" onclick="go('home')" data-t="back"></button><div class="box"><h2 data-t="about"></h2><p style="margin:0" data-t="aboutx"></p></div></div>
<div class="v" id="v-info"><button class="back" onclick="go('home')" data-t="back"></button><div class="box"><h2 data-t="info"></h2><p style="margin:0;white-space:pre-line" data-t="infox"></p></div></div>
<div class="v" id="v-custom"><button class="back" onclick="go('home')" data-t="back"></button>
<form id="cf" class="box"><h2 data-t="cust"></h2><p style="margin:0;color:var(--mut)" data-t="custx"></p>
<label><span data-t="name"></span><input id="cn" required></label>
<label><span data-t="email"></span><input id="ce" type="email" required></label>
<label><span data-t="phone"></span><input id="cp" type="tel"></label>
<label><span data-t="custd"></span><textarea id="cd" rows="5" required></textarea></label>
<button class="btn" type="submit" data-t="custsend"></button><p id="cm" style="margin:0;color:var(--mut)"></p></form></div>
<div class="v" id="v-legal"><button class="back" onclick="go('home')" data-t="back"></button><div class="box"><h2 data-t="legal"></h2><p id="legalx" style="margin:0;white-space:pre-line"></p></div></div>
<div class="v" id="v-track"><button class="back" onclick="go('home')" data-t="back"></button>
<form id="tf" class="box"><h2 data-t="track"></h2><p style="margin:0;color:var(--mut)" data-t="trackhint"></p><label><span data-t="trno"></span><input id="tn" required></label><button class="btn" type="submit" data-t="trackgo"></button></form></div>

<div class="v" id="v-prod"><button class="back" onclick="go('home')" data-t="back"></button><div class="pd" id="pd"></div></div>

<div class="v" id="v-acc"><button class="back" onclick="go('home')" data-t="back"></button>
<form id="af" class="box"><h2 data-t="acc"></h2><p id="accmsg" style="margin:0;color:var(--mut)"></p>
<label><span data-t="email"></span><input id="a_email" type="email" required></label>
<label><span data-t="name"></span><input id="a_name"></label>
<label><span data-t="phone"></span><input id="a_phone" type="tel"></label>
<label><span data-t="addr"></span><input id="a_addr"></label>
<button class="btn" type="submit" data-t="save"></button><button class="btn g" type="button" id="lo" data-t="logout"></button></form>
<div class="box"><h2 data-t="hist"></h2><div id="hist"></div></div></div>
<div class="v" id="v-cart"><button class="back" onclick="go('home')" data-t="back"></button>
<div class="box"><h2 data-t="cart"></h2><div id="items"></div></div>
<form id="f" class="box" autocomplete="on">
<h2 data-t="order"></h2>
<label><span data-t="name"></span><input id="name" required></label>
<label><span data-t="phone"></span><input id="phone" type="tel" required placeholder="+"></label>
<label><span data-t="email"></span><input id="email" type="email" required></label>
<label><span data-t="country"></span><select id="country"></select></label>
<label><span data-t="city"></span><input id="city" required></label>
<label><span data-t="addr"></span><input id="addr" required></label>
<label><span data-t="zip"></span><input id="zip" required autocomplete="postal-code"></label>
<label><span data-t="ship"></span><select id="ship" disabled></select></label>
<div><div style="font-size:14px;color:var(--mut);margin-bottom:6px" data-t="pay"></div><div class="pay" id="pay"></div></div>
<label><span data-t="note"></span><textarea id="note" rows="2"></textarea></label>
<label><span data-t="promo"></span><input id="promo" autocomplete="off"></label>
<div class="sum"><div><span data-t="items"></span><span id="s1"></span></div><div id="drow" style="display:none"><span data-t="disc"></span><span id="s4"></span></div><div><span data-t="delivery"></span><span id="s2"></span></div><div class="t"><span data-t="total"></span><span id="s3"></span></div></div>
<label style="display:flex;gap:8px;align-items:center;color:var(--fg)"><input type="checkbox" id="agree" required style="width:auto"><span><span data-t="agree"></span> <a href="#" onclick="go('legal');return false" data-t="legal" style="color:var(--acc)"></a></span></label>
<button class="btn" type="submit" data-t="send"></button>
<p id="fm" style="margin:0;font-weight:600"></p>
</form>
<div class="box" id="done" style="display:none;border-color:var(--acc)"><h2 data-t="thanks"></h2><p style="margin:0" id="mh" data-t="mailhint"></p><pre id="txt"></pre><button class="btn g" id="copy" data-t="copy"></button></div>
</div>
</main><footer><div id="soc" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:10px"></div><a href="#" onclick="go('about');return false" data-t="about"></a> · <a href="#" onclick="go('info');return false" data-t="info"></a> · <a href="#" onclick="go('legal');return false" data-t="legal"></a> · <a id="ml"></a><br>© PrintWorksLabs · v3</footer>
